
name: CI Biblioteca UTNC

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Validar sintaxis PHP
        run: |
          find . -type f -name "*.php" \
            -not -path "./.git/*" \
            -print0 |
          while IFS= read -r -d '' archivo; do
            php -l "$archivo" || exit 1
          done

      - name: Validar archivo principal
        run: test -f index.html

      
      - name: Verificar archivos JavaScript
        run: |
          cantidad=$(find . -type f -name "*.js" \
            -not -path "./.git/*" | wc -l)
          echo "Archivos JavaScript encontrados: $cantidad"
          test "$cantidad" -gt 0

      
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Vitest
        run: npm install --no-save vitest

      - name: Ejecutar pruebas automatizadas
        run: npx vitest run --environment jsdom


        
