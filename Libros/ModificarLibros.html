<body id="page-top">
    <!-- Page Wrapper -->
    <div id="wrapper">

        <!-- Sidebar -->
            <div id="sidebar"></div>
        <!-- End of Sidebar -->

        <!-- Content Wrapper -->
        <div id="content-wrapper" class="d-flex flex-column">

            <!-- Main Content -->
            <div id="content">

                <!-- Topbar -->
                <div id="topbar"></div>
                <!-- End of Topbar -->
                    <h2>Modificar Libro</h2>

                    <form class="formulario mx-auto" id="modificarLibros" name="modificarLibros" autocomplete="off">
                        <input type="hidden" id="id" name="id" />                        
                        <div class="row justify-content-center">
                            <div class="col-12 col-sm-12 col-md-10 col-lg-12 col-xl-12">
                                <div class="mb-3">
                                    <label for="titulo">Título</label>
                                    <input type="text" class="form-control" id="titulo" name="titulo" required minlength="3" maxlength="200" multipleSpaces="true"/>
                                </div>
                            </div>
                            <div class="col-12 col-sm-12 col-md-10 col-lg-12 col-xl-12">
                                <div class="mb-3">
                                    <label for="fecha_edi">Fecha Edición</label>
                                    <input type="text" class="form-control" id="fecha_edi" name="fecha_edi" required minlength="4" maxlength="30" multipleSpaces="true"/>
                                </div>
                            </div>
                            <div class="col-12 col-sm-12 col-md-10 col-lg-12 col-xl-12">
                                <div class="mb-3">                        
                                    <label for="autores">Autores</label>
                                    <input type="text" class="form-control" id="autores" name="autores" required minlength="5" maxlength="200" multipleSpaces="true"/>
                                </div>
                            </div>
                            <div class="col-12 col-sm-12 col-md-10 col-lg-12 col-xl-12">
                                <div class="mb-3">                        
                                    <label for="res_cus">Responsable de custodia</label>
                                    <input type="text" class="form-control" id="res_cus" name="res_cus" required minlength="10" maxlength="50" multipleSpaces="true"/>
                                </div>
                            </div>

                            <div class="col-12 col-sm-12 col-md-10 col-lg-12 col-xl-12">
                                <div class="mb-3">
                                    <label for="dep_res">Departamento del responsable</label>
                                    <input type="text" class="form-control" id="dep_res" name="dep_res" required minlength="10" maxlength="50" multipleSpaces="true" letters="true"/>  
                                </div>
                            </div>

                            <div class="col-12 col-sm-12 col-md-10 col-lg-12 col-xl-12">
                                <div class="mb-3">                                
                                    <label for="tipo">Tipo</label>
                                    <input type="text" class="form-control" id="tipo" name="tipo" required minlength="5" maxlength="50" multipleSpaces="true"/>
                                </div>
                            </div>

                            <div class="col-12 col-sm-12 col-md-10 col-lg-12 col-xl-12">
                                <div class="mb-3">                                
                                    <label for="editora">Editora</label>
                                    <input type="text" class="form-control" id="editora" name="editora" required minlength="5" maxlength="50" multipleSpaces="true"/>
                                </div>
                            </div>

                            <div class="col-12 col-sm-12 col-md-10 col-lg-12 col-xl-12">
                                <div class="mb-3">                                
                                    <label for="isbn">ISBN</label>
                                    <input type="text" class="form-control" id="ISBN" name="ISBN" required minlength="1" maxlength="20" multipleSpaces="true" numeros="true"/>
                                </div>
                            </div>

                            <div class="col-12 col-sm-12 col-md-10 col-lg-12 col-xl-12">
                                <div class="mb-3">                                
                                    <label for="area">Área</label>
                                    <input type="text" class="form-control" id="area" name="area" required minlength="5" maxlength="50" multipleSpaces="true" letters="true"/>
                                </div>
                            </div>

                            <div class="col-12 col-sm-12 col-md-10 col-lg-12 col-xl-12">
                                <div class="mb-3">                                
                                    <label for="cantidad">Cantidad</label>
                                    <input type="text" class="form-control" id="cantidad" name="cantidad" required  minlength="1" letters="false" maxlength="3" max="500" noSpaces="true" numero="true" integer="true"/>
                                </div> 
                            </div>                            
                        </div>
                        
                        <div class="d-flex justify-content-center mt-4 gap-3">
                            <button class="botonAgregar mr-3" id="guardar" name="guardar" type="submit">Actualizar</button>
                            <a href="Libros.html" class="botonAgregar">Regresar</a>
                        </div>
                    </form>
            </div>
            <!-- End of Main Content -->

            <!-- Footer -->
            <footer class="sticky-footer bg-white">
                <div class="container my-auto">
                    <div class="copyright text-center my-auto">
                    </div>
                </div>
            </footer>
            <!-- End of Footer -->

        </div>
        <!-- End of Content Wrapper -->

    </div>
    <!-- End of Page Wrapper -->

    <a class="scroll-to-top rounded" href="#page-top">

</body>
</html>
